<style>
:root{--bg:#FFE3EC;--pink:#FF5C8A;--violet:#7C5CFF;--sun:#FFD84D;--ink:#2B1B3D}

html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);

#float{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}

@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
main{position:relative;z-index:1;width:100%;max-width:480px;height:100%}
.step{display:none;height:100%;flex-direction:column;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:clamp(10px,2vh,20px) 14px;box-shadow:5px 5px 0 var(--ink);text-align:center;gap:clamp(6px,1.2vh,12px)}

button:focus-visible,input:focus-visible,.opt:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

</div></div>

<script>
/* ===== 데이터 (여기만 고치면 바뀌어요) ===== */
const PLACES=[
 {e:'🍲',n:'의정부'},{e:'🎬',n:'노원'},{e:'🎡',n:'군자'},{e:'🎓',n:'건대'},{e:'🧱',n:'성수'},
 {e:'🌳',n:'서울숲'},{e:'🚋',n:'종로'},{e:'🏮',n:'익선동'},{e:'🏯',n:'북촌'},{e:'🍻',n:'을지로'},
 {e:'👑',n:'광화문'},{e:'🛍️',n:'명동'},{e:'🎸',n:'홍대'},{e:'🌿',n:'연남'},{e:'🌍',n:'이태원'},
 {e:'🥂',n:'한남'},{e:'🌉',n:'여의도'},{e:'🎢',n:'잠실'},{e:'🏙️',n:'강남'},{e:'👜',n:'압구정'},
 {e:'🏡',n:'서촌'},{e:'🍵',n:'삼청동'},{e:'🌳',n:'신사'},{e:'🎵',n:'합정'},{e:'🥐',n:'망원'},
 {e:'🎓',n:'신촌'},{e:'🎭',n:'대학로'},{e:'🛒',n:'동대문'},{e:'🚉',n:'용산'},{e:'🗼',n:'남산'}
];
const FOODS=[
 {e:'🍝',n:'파스타'},{e:'🍕',n:'피자'},{e:'🍚',n:'리조또'},{e:'🥞',n:'브런치'},{e:'🥗',n:'샐러드'},{e:'🥪',n:'샌드위치'},{e:'🥯',n:'베이글'},
 {e:'🧇',n:'와플'},{e:'🥐',n:'크로플'},{e:'🥞',n:'팬케이크'},{e:'🍣',n:'초밥'},{e:'🍜',n:'라멘'},{e:'🍜',n:'쌀국수'},{e:'🍤',n:'팟타이'},
 {e:'🌶️',n:'마라탕'},{e:'🍲',n:'샤브샤브'},{e:'🍢',n:'떡볶이'},{e:'🥟',n:'딤섬'},{e:'🌮',n:'타코'},{e:'🍛',n:'카레'},{e:'🍱',n:'돈까스'},
 {e:'🥩',n:'스테이크'},{e:'🍔',n:'햄버거'},{e:'🍗',n:'치킨'},{e:'🐔',n:'찜닭'},{e:'🍳',n:'닭갈비'},{e:'🥓',n:'삼겹살'},{e:'🍢',n:'양꼬치'},
 {e:'🥔',n:'뇨끼'},{e:'🧀',n:'그라탕'},{e:'🫕',n:'퐁듀'},{e:'🥗',n:'포케'},{e:'🍚',n:'비빔밥'},{e:'🍙',n:'김밥'},{e:'🍜',n:'칼국수'},
 {e:'🍜',n:'냉면'},{e:'🦐',n:'감바스'},{e:'🥘',n:'빠에야'},{e:'🍽️',n:'오마카세'},{e:'🍴',n:'뷔페'},{e:'🍱',n:'한정식'},{e:'🍣',n:'연어'}
];
const AFTER=[
 {e:'☕',n:'카페'},{e:'🍰',n:'디저트'},{e:'🎂',n:'케이크'},{e:'🍬',n:'마카롱'},{e:'🍧',n:'빙수'},{e:'🍦',n:'아이스크림'},{e:'📸',n:'인생네컷'},
 {e:'🖼️',n:'사진관'},{e:'👘',n:'한복'},{e:'🎨',n:'전시'},{e:'🎁',n:'팝업'},{e:'🛍️',n:'쇼핑'},{e:'💄',n:'뷰티샵'},{e:'🧸',n:'소품샵'},
 {e:'📚',n:'서점'},{e:'📖',n:'북카페'},{e:'💐',n:'꽃집'},{e:'🏺',n:'공방'},{e:'🧴',n:'향수'},{e:'🕯️',n:'캔들'},{e:'🎬',n:'영화'},
 {e:'🎭',n:'뮤지컬'},{e:'🔐',n:'방탈출'},{e:'🎲',n:'보드게임'},{e:'🎤',n:'노래방'},{e:'🕹️',n:'오락실'},{e:'🚶',n:'산책'},{e:'🌃',n:'야경'},
 {e:'🌉',n:'한강'},{e:'🌆',n:'전망대'},{e:'🚗',n:'드라이브'},{e:'🎡',n:'놀이공원'},{e:'🐠',n:'수족관'},{e:'🐱',n:'동물카페'},{e:'💆',n:'스파'},
 {e:'♨️',n:'찜질방'},{e:'💅',n:'네일'},{e:'🍷',n:'와인바'},{e:'🍸',n:'칵테일'},{e:'🛋️',n:'룸카페'},{e:'🧺',n:'피크닉'},{e:'🔭',n:'천문대'}
];

/* ===== 공통 ===== */
const $=id=>document.getElementById(id);
const S={place:null,food:null,after:null};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const go=n=>{document.querySelectorAll('.step').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on');};
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600);}

/* 떠다니는 이모지 (동시에 최대 10개, 탭이 숨겨지면 멈춤) */
const EMO=['💖','💕','💘','🌸','✨','🍕','🍔','🥰','🎀','💌'];
function spawn(size){
  const f=$('float');if(f.childElementCount>=10||document.hidden)return;
  const s=document.createElement('span');s.textContent=rnd(EMO);s.style.left=Math.random()*100+'vw';
  const d=5+Math.random()*4;s.style.animationDuration=d+'s';s.style.fontSize=size+Math.random()*20+'px';
  s.addEventListener('animationend',()=>s.remove());f.appendChild(s);
}
setInterval(()=>spawn(18),1200);
const burst=()=>{for(let i=0;i<10;i++)setTimeout(()=>spawn(24),i*90);};

/* ===== 소리: 배경음악 + 효과음 (Web Audio 합성, 브라우저 정책상 첫 터치 후 시작) ===== */
let AC=null,master,musicG,sfxG,muted=false,musicOn=false,nextT=0,stp=0;
const hz=m=>440*Math.pow(2,(m-69)/12);
function audio(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    AC=new C();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
    musicG=AC.createGain();musicG.gain.value=.16;musicG.connect(master);
    sfxG=AC.createGain();sfxG.gain.value=.5;sfxG.connect(master);
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(t,m,dur,type,g,dest){
  const o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.value=hz(m);
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.015);v.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(v);v.connect(dest);o.start(t);o.stop(t+dur+.05);
}
const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],BASS=[48,45,41,43];
const MEL=[76,0,0,79,0,76,0,0, 72,0,76,0,0,74,0,0, 77,0,0,81,0,79,0,0, 79,0,76,0,74,0,72,0];
const ARP=[0,1,2,1,2,1,2,1];
function sched(){
  if(!AC||AC.state!=='running')return;
  while(nextT<AC.currentTime+.4){
    const s=stp%32,ch=CH[s>>3],i=s&7;
    tone(nextT,ch[ARP[i]]+12,.35,'triangle',.5,musicG);
    if(i===0||i===4)tone(nextT,BASS[s>>3]-12+(i?7:0),.55,'sine',.9,musicG);
    if(MEL[s])tone(nextT,MEL[s],.6,'sine',.55,musicG);
    nextT+=.3;stp++;
  }
}
function startMusic(){if(musicOn||!AC)return;musicOn=true;nextT=AC.currentTime+.1;setInterval(sched,100);}
function sfx(k){
  if(muted||!AC||AC.state!=='running')return;
  const t=AC.currentTime;
  if(k==='tap')tone(t,84,.08,'square',.22,sfxG);
  else if(k==='tick')tone(t,96,.035,'square',.1,sfxG);
  else if(k==='pick'){tone(t,79,.09,'triangle',.5,sfxG);tone(t+.06,84,.12,'triangle',.5,sfxG);}
  else if(k==='yes')[72,76,79,84].forEach((m,i)=>tone(t+i*.07,m,.18,'triangle',.5,sfxG));
  else if(k==='win')[72,76,79,84,88,91].forEach((m,i)=>tone(t+i*.09,m,.28,'triangle',.5,sfxG));
  else if(k==='boing'){
    const o=AC.createOscillator(),v=AC.createGain();o.type='sine';
    o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(760,t+.09);o.frequency.exponentialRampToValueAtTime(420,t+.2);
    v.gain.setValueAtTime(.4,t);v.gain.exponentialRampToValueAtTime(.001,t+.22);
    o.connect(v);v.connect(sfxG);o.start(t);o.stop(t+.25);
  }
}
const unlock=()=>{if(audio())startMusic();};
['pointerup','touchend','keydown','click'].forEach(ev=>document.addEventListener(ev,unlock,true));
document.addEventListener('click',e=>{
  const b=e.target.closest('button,.opt');
  if(!b||b.id==='no'||b.id==='mute')return;

},true);
$('mute').onclick=()=>{
  muted=!muted;$('mute').textContent=muted?'🔇':'🔊';

document.addEventListener('visibilitychange',()=>{if(AC){document.hidden?AC.suspend():AC.resume();}});

/* ===== 0. 거절 버튼: 마우스/손가락 주변에서만 도망 ===== */
const no=$('no'),yes=$('yes'),slot=$('slot'),EDGE=14;
const MSG={1:'어? 🤭',5:'잡아봐~ 🏃‍♂️💨',10:'그냥 수락하자 응? 🥺'};   /* 몇 번째 시도에 어떤 문구를 보여줄지 */
let ox=0,oy=0,tries=0,mx=0,my=0,pending=false,reach=45;

function flee(px,py){
  const r=no.getBoundingClientRect(),sr=slot.getBoundingClientRect();
  const hw=r.width/2,hh=r.height/2;
  const W=Math.min(innerWidth,document.documentElement.clientWidth),H=Math.min(innerHeight,document.documentElement.clientHeight);
  const bx=sr.left+sr.width/2,by=sr.top+sr.height/2;            /* 슬롯(원래 자리) 중심: 항상 고정된 기준 */
  const yr=yes.getBoundingClientRect();
  const away=Math.atan2(r.top+hh-py,r.left+hw-px);              /* 마우스 반대 방향 */
  let pick=null,far=-1;
  for(let i=0;i<18;i++){
    const a=i?away+(Math.random()-.5)*(i<10?2.4:6.28):away;
    const R=(reach>60?170:105)+Math.random()*55;                               /* 마우스 주변 고리 안에서만 이동 */
    const cx=Math.min(W-hw-EDGE,Math.max(hw+EDGE,px+Math.cos(a)*R));   /* 버튼 전체가 창 안에 있도록 */
    const cy=Math.min(H-hh-EDGE,Math.max(hh+EDGE,py+Math.sin(a)*R));
    if(cx+hw>yr.left-6&&cx-hw<yr.right+6&&cy+hh>yr.top-6&&cy-hh<yr.bottom+6)continue;
    const d=Math.hypot(cx-px,cy-py);
    if(d>far){far=d;pick={cx,cy};}
    if(d>=(reach>60?150:90))break;
  }
  if(!pick)return;
  ox=pick.cx-bx;oy=pick.cy-by;
  no.style.transform=`translate(${ox}px,${oy}px)`;
  tries++;if(MSG[tries])$('hint').textContent=MSG[tries];
  yes.style.transform=`scale(${Math.min(1+tries*0.04,1.35)})`;
  sfx('boing');
}
/* 안전장치: 이동이 끝난 뒤 / 창 크기가 바뀐 뒤에도 밖으로 나가 있으면 안으로 밀어넣기 */
function guard(){
  const r=no.getBoundingClientRect();
  const W=Math.min(innerWidth,document.documentElement.clientWidth),H=Math.min(innerHeight,document.documentElement.clientHeight);
  let dx=0,dy=0;
  if(r.left<EDGE)dx=EDGE-r.left;else if(r.right>W-EDGE)dx=W-EDGE-r.right;
  if(r.top<EDGE)dy=EDGE-r.top;else if(r.bottom>H-EDGE)dy=H-EDGE-r.bottom;
  if(dx||dy){ox+=dx;oy+=dy;no.style.transform=`translate(${ox}px,${oy}px)`;}
}
no.addEventListener('transitionend',guard);
function check(){
  pending=false;
  const r=no.getBoundingClientRect();
  const d=Math.hypot(mx-(r.left+r.width/2),my-(r.top+r.height/2));
  if(d<Math.max(r.width,r.height)/2+reach)flee(mx,my);
}
const on0=()=>$('s0').classList.contains('on')&&$('modal').hidden;
const track=(x,y)=>{mx=x;my=y;if(!pending){pending=true;requestAnimationFrame(check);}};
document.addEventListener('mousemove',e=>{if(on0()){reach=45;track(e.clientX,e.clientY);}});
/* 모바일: 버튼 근처를 터치하는 순간 옆으로 튕겨나가고, 클릭은 발생하지 않음 */
document.addEventListener('touchstart',e=>{
  if(!on0()||e.target.closest('#yes'))return;const t=e.touches[0];
  const r=no.getBoundingClientRect();
  if(Math.hypot(t.clientX-(r.left+r.width/2),t.clientY-(r.top+r.height/2))<Math.max(r.width,r.height)/2+45){e.preventDefault();reach=45;flee(t.clientX,t.clientY);}
},{passive:false});
document.addEventListener('touchmove',e=>{if(on0()){const t=e.touches[0];reach=45;track(t.clientX,t.clientY);}},{passive:true});
no.addEventListener('click',e=>{e.preventDefault();flee(e.clientX||innerWidth/2,e.clientY||innerHeight/2);});
no.addEventListener('focus',()=>{const r=no.getBoundingClientRect();flee(r.left+r.width/2,r.top+r.height/2);});
addEventListener('resize',guard);
yes.addEventListener('click',()=>{burst();go(1);});

/* ===== 디데이 / 기념일 (여기만 고치면 바뀌어요) ===== */
const START=new Date(2026,8,27);   /* 9월 27일 = 1일째 */
const EVENTS=[
 {e:'🎂',n:'효영이 생일',m:9,d:17},
 {e:'🎁',n:'내 생일',m:3,d:14},
 {e:'🥂',n:'1주년',date:new Date(2027,8,27)},
 {e:'🥂',n:'2주년',date:new Date(2028,8,27)},
 {e:'🥂',n:'3주년',date:new Date(2029,8,27)},
 {e:'🎊',n:'새해',m:1,d:1},
 {e:'💘',n:'발렌타인',m:2,d:14},
 {e:'🍫',n:'빼빼로데이',m:11,d:11},
 {e:'🎄',n:'크리스마스',m:12,d:25}
];
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const dayNo=()=>Math.round((midnight(new Date())-START)/864e5)+1;
function nextDate(ev){
  if(ev.date)return ev.date;
  const t=midnight(new Date());let x=new Date(t.getFullYear(),ev.m-1,ev.d);
  if(x<t)x=new Date(t.getFullYear()+1,ev.m-1,ev.d);return x;
}
function left(tg){                                   /* 1일 미만 남으면 시간으로 */
  const n=new Date(),days=Math.round((tg-midnight(n))/864e5);
  if(days<=0)return '🎉 오늘!';
  if(days===1)return `⏰ ${Math.ceil((tg-n)/36e5)}시간 남음`;
  return `D-${days}`;
}
const p2=n=>String(n).padStart(2,'0');
function renderDD(){
  const n=dayNo();
  $('dday').textContent=n>=1?`💕 우리 ${n}일째`:`💕 D-${1-n}`;
  $('mtop').textContent=n>=1?`${n}일째 사랑하는 중 🥰`:`D-${1-n}`;
  const today=midnight(new Date());
  $('mlist').innerHTML=EVENTS.map(ev=>({ev,tg:nextDate(ev)})).filter(o=>o.tg>=today).sort((a,b)=>a.tg-b.tg)
    .map(o=>`<div class="ev"><span>${o.ev.e} ${o.ev.n}<small>${o.tg.getFullYear()}.${p2(o.tg.getMonth()+1)}.${p2(o.tg.getDate())}</small></span><strong>${left(o.tg)}</strong></div>`).join('');
}
const modal=$('modal');
const openDD=()=>{renderDD();modal.hidden=false;};
$('dday').onclick=openDD;$('dd2').onclick=openDD;
$('mclose').onclick=()=>{modal.hidden=true;};
modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true;});
setInterval(()=>{if(!modal.hidden)renderDD();},30000);
renderDD();

/* ===== 1. 날짜 (기본값: 다가오는 토요일) ===== */
const t0=new Date();t0.setDate(t0.getDate()+((6-t0.getDay()+7)%7||7));
$('date').value=`${t0.getFullYear()}-${String(t0.getMonth()+1).padStart(2,'0')}-${String(t0.getDate()).padStart(2,'0')}`;
$('to2').onclick=()=>{$('date').value?go(2):toast('날짜를 골라줘 📅');};

/* ===== 식사 시간대 추천 (고른 시간에 맞는 메뉴를 앞으로 + ⭐) ===== */
const SLOT={brunch:['☀️','브런치 시간'],lunch:['🍱','점심 시간'],snack:['🧁','간식 시간'],dinner:['🌙','저녁 시간'],late:['🍺','야식 시간']};
const REC={
 brunch:['브런치','샌드위치','베이글','와플','크로플','팬케이크','샐러드','리조또','파스타'],
 lunch:['파스타','리조또','샐러드','포케','돈까스','카레','라멘','쌀국수','팟타이','초밥','햄버거','딤섬','칼국수','냉면','비빔밥','샌드위치'],
 snack:['와플','크로플','팬케이크','베이글','떡볶이','샌드위치','타코','김밥','피자'],
 dinner:['스테이크','샤브샤브','삼겹살','양꼬치','초밥','오마카세','감바스','빠에야','퐁듀','파스타','피자','마라탕','닭갈비','찜닭','한정식','연어'],
 late:['치킨','피자','떡볶이','마라탕','닭갈비','감바스','그라탕','찜닭']
};
function slotOf(t){const [h,m]=(t||'14:00').split(':').map(Number),x=h*60+m;
  return x<690?'brunch':x<870?'lunch':x<1050?'snack':x<1260?'dinner':'late';}
const recFood=()=>REC[slotOf($('time').value)];

/* ===== 선택 격자 (이벤트 위임) ===== */
function grid(id,list,key,recFn){
  const g=$(id);
  const mark=()=>[...g.children].forEach(c=>c.classList.toggle('sel',S[key]===list[+c.dataset.i]));
  const render=()=>{
    const rec=recFn?recFn():[];
    const idx=list.map((_,i)=>i).sort((a,b)=>(rec.includes(list[b].n)?1:0)-(rec.includes(list[a].n)?1:0)||a-b);
    g.innerHTML=idx.map(i=>`<div class="opt${rec.includes(list[i].n)?' rec':''}" role="button" tabindex="0" data-i="${i}"><b>${list[i].e}</b>${list[i].n}</div>`).join('');
    mark();
  };
  const pick=el=>{const o=el.closest('.opt');if(o){S[key]=list[+o.dataset.i];mark();}};
  g.onclick=e=>pick(e.target);
  g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e.target);}};
  render();
  const rand=()=>{S[key]=rnd(list);mark();toast('🎲 '+S[key].n+'!');};
  rand.render=render;
  return rand;
}
const rp=grid('placeGrid',PLACES,'place'),rf=grid('foodGrid',FOODS,'food',recFood),ra=grid('afterGrid',AFTER,'after');
$('rndPlace').onclick=rp;$('rndFood').onclick=rf;$('rndAfter').onclick=ra;
$('to3').onclick=()=>{
  if(!S.place){toast('장소를 골라줘 📍');return;}
  const sl=SLOT[slotOf($('time').value)];
  $('slotNote').textContent=`${sl[0]} ${sl[1]}이라 ⭐ 메뉴를 앞에 모아놨어!`;
  rf.render();go(3);
};
$('to4').onclick=()=>S.food?go(4):toast('메뉴를 골라줘 😋');
$('to5').onclick=()=>{if(!S.after){toast('2차를 골라줘 🎉');return;}showResult();go(5);burst();setTimeout(()=>sfx("win"),150);};

/* ===== 결과 & 공유 ===== */
function fmt(){
  const [y,m,d]=$('date').value.split('-').map(Number);
  const wd='일월화수목금토'[new Date(y,m-1,d).getDay()];
  const [hh,mm]=($('time').value||'14:00').split(':').map(Number);
  return {date:`${m}월 ${d}일 (${wd})`,time:`${hh<12?'오전':'오후'} ${hh%12===0?12:hh%12}시${mm?` ${mm}분`:''}`};
}
function link(){                                   /* 선택 내용이 담긴 링크 (웹에 올렸을 때만) */
  if(!/^https?:$/.test(location.protocol))return '';
  const q=new URLSearchParams({d:$('date').value,t:$('time').value||'14:00',p:PLACES.indexOf(S.place),f:FOODS.indexOf(S.food),a:AFTER.indexOf(S.after)});
  return location.href.split('#')[0]+'#'+q;
}
function msg(){
  const f=fmt(),lk=link();
  return `💌 효영아!! 우리 데이트 확정 💘\n\n📅 ${f.date}\n⏰ ${f.time}\n📍 ${S.place.n} ${S.place.e}\n🍽️ ${S.food.n} ${S.food.e}\n🎉 2차: ${S.after.n} ${S.after.e}\n⏳ ${dateLeft()}\n\n${f.time}에 ${S.place.n}에서 만나! ${S.food.n} 먹고 ${S.after.n} 가자 🥰💕\n\n🗺️ https://map.kakao.com/link/search/${encodeURIComponent(S.place.n+' '+S.food.n)}`+(lk?`\n💌 ${lk}`:'');
}
function showResult(){
  const f=fmt();
  $('ticket').innerHTML=`📅 ${f.date}<br>⏰ ${f.time}<br>📍 ${S.place.n} ${S.place.e}<br>🍽️ ${S.food.n} ${S.food.e}<br>🎉 2차 ${S.after.n} ${S.after.e}<br>⏳ ${dateLeft()}`;
}
function copyText(text,ok){
  const done=()=>toast(ok);
  const fb=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('복사 실패 😢');}ta.remove();};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done,fb);else fb();
}
$('share').onclick=async()=>{
  const text=msg();
  if(navigator.share){try{await navigator.share({title:'💌 데이트 약속',text});return;}catch(e){if(e.name==='AbortError')return;}}
  copyText(text,'복사했어! 카톡에 붙여넣기 💬');
};
$('copy').onclick=()=>copyText(msg(),'복사 완료 📋');
$('again').onclick=()=>{S.place=S.food=S.after=null;document.querySelectorAll('.opt.sel').forEach(o=>o.classList.remove('sel'));go(1);};
/* ===== 데이트까지 D-N (1일 미만이면 시간으로) ===== */
function dateLeft(){
  const [y,m,d]=$('date').value.split('-').map(Number),[hh,mm]=($('time').value||'14:00').split(':').map(Number);
  const tg=new Date(y,m-1,d,hh,mm),n=new Date(),ms=tg-n,days=Math.round((midnight(tg)-midnight(n))/864e5);
  if(ms<=0)return days<0?'💝 다녀온 데이트':'🎉 오늘 데이트!';
  if(ms<864e5){const h=Math.floor(ms/36e5),mi=Math.floor(ms%36e5/6e4);return h?`⏰ ${h}시간 ${mi}분 남음`:`⏰ ${mi}분 남음`;}
  return `D-${days}`;
}

/* ===== 전체 랜덤: 날짜 → 시간 → 장소 → 음식 → 2차 순서로 룰렛처럼 빠르게 결정 ===== */
const dl=ds=>{const [y,m,d]=ds.split('-').map(Number);return `${m}/${d} (${'일월화수목금토'[new Date(y,m-1,d).getDay()]})`;};
const tl=t=>{const [h,mi]=t.split(':').map(Number);return `${h<12?'오전':'오후'} ${h%12||12}:${p2(mi)}`;};
const rDate=()=>{const d=new Date();d.setDate(d.getDate()+1+Math.floor(Math.random()*30));return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;};
const rTime=()=>p2(11+Math.floor(Math.random()*10))+':'+rnd(['00','30']);
const lab=x=>x.e+' '+x.n;
let rolling=false;
function rollAll(){
  if(rolling)return;rolling=true;
  const fd=rDate(),ft=rTime(),fp=rnd(PLACES),pool=FOODS.filter(f=>REC[slotOf(ft)].includes(f.n)),ff=rnd(pool.length?pool:FOODS),fa=rnd(AFTER);
  const stages=[
    {id:'r0',gen:()=>dl(rDate()),fin:dl(fd),done:()=>{$('date').value=fd;}},
    {id:'r1',gen:()=>tl(rTime()),fin:tl(ft),done:()=>{$('time').value=ft;}},
    {id:'r2',gen:()=>lab(rnd(PLACES)),fin:lab(fp),done:()=>{S.place=fp;}},
    {id:'r3',gen:()=>lab(rnd(FOODS)),fin:lab(ff),done:()=>{S.food=ff;}},
    {id:'r4',gen:()=>lab(rnd(AFTER)),fin:lab(fa),done:()=>{S.after=fa;}}
  ];
  for(const st of stages){const el=$(st.id);el.textContent='❔';el.parentElement.className='rr';}
  $('roll').hidden=false;
  let i=0;
  const next=()=>{
    if(i>=stages.length){setTimeout(()=>{$('roll').hidden=true;rolling=false;showResult();go(5);burst();sfx('win');},550);return;}
    const st=stages[i++],el=$(st.id),row=el.parentElement;row.classList.add('spin');
    let n=0;
    const iv=setInterval(()=>{
      el.textContent=st.gen();sfx('tick');
      if(++n>8){clearInterval(iv);el.textContent=st.fin;row.className='rr lock';st.done();sfx('pick');setTimeout(next,170);}
    },65);
  };
  next();
}
$('rollBtn').onclick=rollAll;

/* ===== 테마 색 (선택은 이 기기에 저장) ===== */
const THEMES=['pink','mint','lavender','sky','peach'],TNAME=['핑크 💗','민트 🍃','라벤더 💜','하늘 ☁️','피치 🍑'];
let ti=0;try{ti=Math.max(0,THEMES.indexOf(localStorage.getItem('theme')));}catch(e){}
const setTheme=()=>{document.documentElement.dataset.theme=THEMES[ti];};
setTheme();
$('theme').onclick=()=>{ti=(ti+1)%THEMES.length;setTheme();try{localStorage.setItem('theme',THEMES[ti]);}catch(e){}toast('🎨 '+TNAME[ti]);};

/* ===== 링크로 열면 선택 내용이 담긴 결과 화면이 바로 뜸 ===== */
(function fromLink(){
  const q=new URLSearchParams(location.hash.slice(1));
  const idx=k=>q.has(k)&&/^\d+$/.test(q.get(k))?+q.get(k):-1;
  const d=q.get('d')||'',t=q.get('t')||'',pl=PLACES[idx('p')],fo=FOODS[idx('f')],af=AFTER[idx('a')];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!/^\d{2}:\d{2}$/.test(t)||!pl||!fo||!af)return;
  $('date').value=d;$('time').value=t;S.place=pl;S.food=fo;S.after=af;
  showResult();go(5);
})();
